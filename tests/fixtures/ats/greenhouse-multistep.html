<!doctype html><html><body>
<h1 class="app-title">Platform Engineer</h1>
<div class="company-name">Beacon Systems</div>
<form id="application_form" action="https://boards.greenhouse.io/beacon/jobs/5">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="email">Email *</label><input id="email" type="email" name="email" required>
  <label for="relocate">Are you willing to relocate?</label>
  <input type="radio" id="relocate_yes" name="relocate" value="Yes"><label for="relocate_yes">Yes</label>
  <input type="radio" id="relocate_no" name="relocate" value="No"><label for="relocate_no">No</label>
  <button type="button" id="continue">Save and Continue</button>
</form>
</body></html>
