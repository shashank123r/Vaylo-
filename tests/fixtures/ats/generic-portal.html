<!doctype html><html><head><title>Senior Platform Engineer - Acme Corp</title></head>
<body>
  <h1 class="job-title">Senior Platform Engineer</h1>
  <div class="company-name">Acme Corp</div>
  <form id="custom-apply">
    <label for="fn">Full name</label><input id="fn" name="full_name" required />
    <label for="em">Email address</label><input id="em" type="email" name="email" required />
    <label for="ph">Phone</label><input id="ph" type="tel" name="phone" />
    <label for="loc">Current location</label><input id="loc" name="location" />
    <label for="li">LinkedIn profile</label><input id="li" type="url" name="linkedin" />
    <label for="gh">GitHub</label><input id="gh" type="url" name="github" />
    <label for="cv">Upload your resume (PDF)</label><input id="cv" type="file" name="resume" />
    <label for="visa">Will you require visa sponsorship?</label><input id="visa" name="sponsorship" />
    <label for="cl">Cover letter</label><textarea id="cl" name="cover_letter"></textarea>
    <button type="submit">Submit application</button>
  </form>
</body></html>
