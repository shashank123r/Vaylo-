<!doctype html><html><body>
<div class="JobPostingHeader-root"><h1>Computer Vision Engineer</h1></div>
<form class="ashby-application-form">
  <input aria-label="Name" name="_systemfield_name" required>
  <input aria-label="Email" type="email" name="_systemfield_email" required>
  <input aria-label="Phone Number" type="tel" name="phone">
  <input aria-label="LinkedIn" type="url" name="linkedin">
  <input aria-label="Resume" type="file" name="_systemfield_resume" required>
  <select aria-label="What is your gender?" name="demographic_gender"><option>Prefer not to say</option></select>
  <textarea aria-label="Cover Letter" name="coverletter"></textarea>
  <input aria-label="Years of experience with Python" name="q1">
  <button type="submit">Submit</button>
</form>
</body></html>
