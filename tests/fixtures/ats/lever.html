<!doctype html><html><body>
<div class="posting-headline"><h2>Generative AI Engineer</h2></div>
<img class="main-header-logo" alt="Clearwater AI" src="logo.png">
<form class="application-form" action="https://jobs.lever.co/clearwater/apply">
  <label>Full name<input name="name" required></label>
  <label>Email<input name="email" type="email" required></label>
  <label>Phone<input name="phone" type="tel"></label>
  <label>LinkedIn URL<input name="urls[LinkedIn]" type="url"></label>
  <label>Resume/CV<input name="resume" type="file" required></label>
  <label>Will you now or in the future require sponsorship for employment visa status?
    <select name="cards[a1][sponsorship]"><option>Yes</option><option>No</option></select></label>
  <label>Additional information<textarea name="comments"></textarea></label>
  <button type="submit">Submit application</button>
</form>
</body></html>
