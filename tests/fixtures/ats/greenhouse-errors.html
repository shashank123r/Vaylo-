<!doctype html><html><body>
<h1 class="app-title">Senior ML Engineer</h1>
<form id="application_form" action="https://boards.greenhouse.io/acme/jobs/1">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="email">Email *</label>
  <input id="email" type="email" name="email" required aria-invalid="true" aria-describedby="email_err">

  <div role="alert">There was a problem with your submission.</div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
